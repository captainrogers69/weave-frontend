<style>
  /* Absolute paths on purpose: this page is shown at any missing URL, at any depth. */
  @font-face { font-family: "Geist"; src: url("/fonts/Geist-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Geist"; src: url("/fonts/Geist-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
  :root { --yellow: #F5C84C; --ink: #141414; --paper: #F1F1EF; --soft: #55554F; --m: clamp(16px, 3vw, 44px); }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font: 400 17px/1.6 "Geist", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--yellow); color: var(--ink); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  .bar { display: flex; align-items: center; height: 64px; padding: 0 var(--m); background: var(--ink); color: var(--paper); }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 500; font-size: 18px; letter-spacing: -.02em; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .bar :focus-visible { outline-color: var(--yellow); }
  main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 56px 16px 96px; }
  h1 { font-weight: 500; letter-spacing: -.03em; font-size: clamp(36px, 7vw, 56px); line-height: 1.05; margin: 0 0 16px; }
  .code { display: inline-block; background: var(--yellow); border-radius: 6px; padding: 0 8px; font-size: 15px; font-weight: 500; margin: 0 0 16px; }
  p { color: var(--soft); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; font-weight: 500; }
  a { color: inherit; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  a:hover { text-decoration-color: var(--yellow); }
</style>
</head>
<body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave</title>
<meta name="description" content="Weave: lists and tasks that work offline and sync between your devices.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #fbfaf7; --text: #1a1a1a; --muted: #5c5c5c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --text: #ededed; --muted: #a3a3a3; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text); text-align: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { padding: 48px 16px; max-width: 480px; }
  svg { width: 88px; height: 88px; }
  h1 { font-size: 36px; margin: 16px 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  nav a { color: inherit; margin: 0 10px; text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="57" fill="#F5C84C"/><path d="M128 0H199A57 57 0 0 1 256 57V128A128 128 0 0 1 128 0Z" fill="#141414"/></svg>
  <h1>Weave</h1>
  <p>Lists and tasks that work offline and sync between your devices.</p>
  <nav>
    <a href="/privacy/">Privacy Policy</a>
    <a href="mailto:mobiledev.mayank@gmail.com">Support</a>
  </nav>
</main>
</body>
</html>
